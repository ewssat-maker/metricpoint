<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetricPoint - Weather Forecast OS (MODO DIOS)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#fff;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}#mapFull{position:absolute;inset:0;z-index:1}.hud-panel{position:absolute;z-index:1000;background:rgba(10,15,25,.92);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:25px;box-shadow:0 10px 40px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.1);max-height:95%;overflow-y:auto;backdrop-filter:blur(10px)}#hud-controls{top:20px;left:20px;width:380px}h2{margin:0 0 15px;font-family:monospace;font-size:24px;letter-spacing:1px;color:#fff;border-bottom:1px solid rgba(56,189,248,.3);padding-bottom:10px;text-shadow:0 0 20px rgba(56,189,248,.2)}label{font-size:14px;color:#ccc;text-transform:uppercase;font-family:monospace;display:block;margin-bottom:6px;font-weight:700}select,input[type="text"]{width:100%;background:rgba(0,0,0,.8);color:#eab308;border:1px solid #555;padding:12px;margin-bottom:18px;font-family:monospace;font-size:15px;font-weight:700;border-radius:4px;transition:.3s}select:focus,input:focus{border-color:#38bdf8;box-shadow:0 0 20px rgba(56,189,248,.4);outline:0}.btn-run{width:100%;padding:16px;margin-bottom:10px;border:0;border-radius:4px;font-weight:700;font-family:monospace;font-size:16px;cursor:pointer;transition:.3s;text-transform:uppercase;background:linear-gradient(90deg,#38bdf8,#0ea5e9);color:#00131d;box-shadow:0 4px 15px rgba(56,189,248,.3)}.btn-run:hover{filter:brightness(1.2);box-shadow:0 8px 25px rgba(56,189,248,.6);transform:translateY(-2px)}.status-msg{font-size:13px;color:#fff;font-family:monospace;margin-bottom:20px;margin-top:15px;background:rgba(255,255,255,.1);padding:12px;border-radius:4px;border-left:3px solid #38bdf8}.weather-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:20px}.weather-card{background:linear-gradient(135deg,rgba(0,0,0,.6),rgba(56,189,248,.05));border:1px solid rgba(56,189,248,.3);padding:20px;border-radius:8px;text-align:center;transition:.4s;box-shadow:0 0 20px rgba(0,0,0,.5)}.weather-card:hover{border-color:#38bdf8;background:linear-gradient(135deg,rgba(56,189,248,.15),rgba(56,189,248,.08));box-shadow:0 0 30px rgba(56,189,248,.3);transform:translateY(-4px)}.weather-card h4{margin:0 0 8px;font-size:14px;color:#ccc;font-family:monospace;text-transform:uppercase}.weather-card .val{font-size:32px;font-weight:700;color:#eab308;margin:5px 0;font-family:'Courier New',Courier,monospace;text-shadow:0 0 15px rgba(234,179,8,.6)}.scifi-row{display:flex;justify-content:space-between;margin-bottom:12px;border-bottom:1px solid rgba(255,255,255,.1);padding-bottom:8px;font-size:15px;align-items:center}.scifi-label{color:#ddd;font-family:monospace;font-weight:700}.scifi-val{font-family:'Courier New',monospace;font-weight:700;font-size:18px;color:#eab308;text-shadow:0 0 10px rgba(234,179,8,.5)}.station-badge{background:transparent;border:none;filter:drop-shadow(0 8px 16px rgba(0,0,0,.35))}.station-inner{display:flex;align-items:center;justify-content:center;gap:6px;padding:7px 12px;border-radius:18px;border:2px solid rgba(255,255,255,.35);color:#fff;font-weight:700;text-shadow:0 2px 5px rgba(0,0,0,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 10px 18px rgba(0,0,0,.28);transform:perspective(900px) rotateX(5deg);transition:transform .2s ease,box-shadow .2s ease;white-space:nowrap}#mapFull.map-small .station-inner{font-size:10px;padding:6px 10px;border-radius:14px}#mapFull.map-medium .station-inner{font-size:12px;padding:7px 12px;border-radius:16px}#mapFull.map-large .station-inner{font-size:13px;padding:8px 14px;border-radius:18px}#mapFull.map-xlarge .station-inner{font-size:15px;padding:9px 16px;border-radius:20px}.leaflet-popup-content-wrapper{background:rgba(15,23,42,.95);color:#cbd5e1;border-radius:12px;border:1px solid rgba(56,189,248,.3);padding:0;box-shadow:0 8px 32px rgba(0,0,0,.5);backdrop-filter:blur(10px)}.leaflet-popup-tip{background:rgba(15,23,42,.95)}.leaflet-popup-content{margin:0;padding:16px;font-size:13px}.popup-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid rgba(56,189,248,.2)}.popup-header h3{margin:0;color:#38bdf8;font-size:14px;font-weight:700}.popup-badge{display:inline-block;background:rgba(56,189,248,.2);color:#38bdf8;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}.popup-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05)}.popup-row:last-child{border-bottom:none}.popup-row .label{color:#94a3b8}.popup-row .value{color:#38bdf8;font-weight:600}.legend{position:absolute;bottom:20px;left:20px;z-index:1000;backdrop-filter:blur(10px);background:rgba(15,23,42,.6);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:16px;max-width:250px}.legend h4{margin:0 0 10px 0;color:#38bdf8;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}.legend-item{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;color:#cbd5e1}.legend-color{width:24px;height:24px;border-radius:6px;border:1px solid rgba(255,255,255,.2)}.leaflet-control-zoom{border-radius:8px !important;box-shadow:0 4px 12px rgba(0,0,0,.3) !important;border:1px solid rgba(255,255,255,.1) !important;background:rgba(15,23,42,.7) !important}.leaflet-control-zoom a{background:rgba(56,189,248,.1) !important;color:#38bdf8 !important;border-color:rgba(56,189,248,.2) !important;font-weight:700 !important}.leaflet-attribution{background:rgba(15,23,42,.7) !important;border-radius:8px !important;border:1px solid rgba(255,255,255,.1) !important;color:#94a3b8 !important;font-size:11px !important}.leaflet-attribution a{color:#38bdf8 !important}
    </style>
</head>
<body>
<div id="mapFull"></div>
<div id="hud-controls" class="hud-panel">
    <h2>[ WEATHER FORECAST ]</h2>
    <p style="font-size:13px;color:#bbb;font-family:monospace;margin:-10px 0 25px 0;">🛰️ Agrometeorología de Precisión</p>
    <label>Seleccionar Ubicación:</label>
    <select id="selCiudad" onchange="MapMgr.handleLocationSelect()">
        <option value="custom" selected>📍 Haga clic en el mapa</option>
        <optgroup label="Tucumán">
            <option value="-26.8241,-65.2226">San Miguel de Tucumán</option>
            <option value="-26.8525,-65.7102">Tafí del Valle</option>
            <option value="-27.3400,-65.5960">Concepción</option>
        </optgroup>
        <optgroup label="Salta">
            <option value="-24.7821,-65.4232">Salta Capital</option>
            <option value="-26.0730,-65.9761">Cafayate</option>
        </optgroup>
        <optgroup label="Buenos Aires">
            <option value="-34.6037,-58.3816">Buenos Aires</option>
            <option value="-38.0055,-57.5431">Mar del Plata</option>
        </optgroup>
    </select>
    <div class="status-msg" id="statusMsg">✓ Mapa listo. Haga clic o seleccione ciudad.</div>
    <button class="btn-run" onclick="fetchWeather()">📡 OBTENER TELEMETRÍA</button>
    <div class="weather-grid">
        <div class="weather-card">
            <h4>Temperatura</h4>
            <div class="val" id="resTemp">--°C</div>
        </div>
        <div class="weather-card">
            <h4>Humedad</h4>
            <div class="val" id="resHumedad">--%</div>
        </div>
    </div>
    <div class="scifi-row"><span class="scifi-label">Viento</span><span class="scifi-val" id="resViento">-- km/h</span></div>
    <div class="scifi-row"><span class="scifi-label">Presión</span><span class="scifi-val" id="resPresion">-- hPa</span></div>
    <div class="scifi-row"><span class="scifi-label">Punto Rocío</span><span class="scifi-val" id="resRocio">-- °C</span></div>
</div>

<div class="legend" id="legend">
    <h4>Escala de Valores</h4>
    <div id="legendContent"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const STATIONS = [
    {nombre:'Córdoba Centro',lat:-31.4135,lon:-64.1811,temp:22.5,lluvia:0,viento:12,provincia:'Córdoba'},
    {nombre:'Rosario',lat:-32.9468,lon:-60.6393,temp:19.8,lluvia:5.2,viento:18,provincia:'Santa Fe'},
    {nombre:'Mendoza',lat:-32.8897,lon:-68.8451,temp:28.3,lluvia:0,viento:22,provincia:'Mendoza'},
    {nombre:'Buenos Aires',lat:-34.6037,lon:-58.3816,temp:18.5,lluvia:8.3,viento:16,provincia:'Buenos Aires'},
    {nombre:'Mar del Plata',lat:-38.0055,lon:-57.5431,temp:15.2,lluvia:12.4,viento:35,provincia:'Buenos Aires'},
    {nombre:'Tucumán',lat:-26.8241,lon:-65.2226,temp:25.3,lluvia:1.5,viento:20,provincia:'Tucumán'},
    {nombre:'Salta',lat:-24.7859,lon:-65.4038,temp:27.1,lluvia:0.8,viento:19,provincia:'Salta'},
    {nombre:'Jujuy',lat:-23.5881,lon:-65.3975,temp:28.5,lluvia:3.2,viento:17,provincia:'Jujuy'},
    {nombre:'Misiones',lat:-27.3622,lon:-55.5038,temp:23.9,lluvia:15.6,viento:21,provincia:'Misiones'},
    {nombre:'Corrientes',lat:-27.4805,lon:-58.8345,temp:22.1,lluvia:7.8,viento:16,provincia:'Corrientes'},
    {nombre:'Entre Ríos',lat:-32.1540,lon:-60.6769,temp:20.5,lluvia:4.2,viento:13,provincia:'Entre Ríos'},
    {nombre:'Neuquén',lat:-38.9516,lon:-68.0591,temp:16.7,lluvia:2.1,viento:38,provincia:'Neuquén'},
    {nombre:'Río Negro',lat:-41.1357,lon:-71.3112,temp:14.3,lluvia:0.5,viento:42,provincia:'Río Negro'},
    {nombre:'La Rioja',lat:-29.4139,lon:-66.8611,temp:29.2,lluvia:0,viento:28,provincia:'La Rioja'},
    {nombre:'San Juan',lat:-31.5375,lon:-68.5256,temp:26.7,lluvia:2.1,viento:25,provincia:'San Juan'},
    {nombre:'Santa Fe',lat:-31.6309,lon:-60.7125,temp:20.1,lluvia:0,viento:15,provincia:'Santa Fe'},
    {nombre:'La Plata',lat:-34.9215,lon:-57.9544,temp:17.8,lluvia:6.5,viento:14,provincia:'Buenos Aires'}
];

let STATE = {coord:null,marker:null,variable:'temp',stationMarkers:[]};

const MapMgr = {
    map: null,
    init() {
        this.map = L.map('mapFull', {zoomControl:false, attributionControl:true}).setView([-26.8241,-65.2226], 7);
        L.control.zoom({position:'bottomright'}).addTo(this.map);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:18, attribution:'© OSM'}).addTo(this.map);
        
        this.map.on('click', e => {
            if (document.getElementById('selCiudad').value !== 'custom') return;
            if (STATE.marker) this.map.removeLayer(STATE.marker);
            STATE.coord = [e.latlng.lat, e.latlng.lng];
            STATE.marker = L.circleMarker(STATE.coord, {radius:8,fillColor:'#38bdf8',color:'#fff',weight:2,fillOpacity:.8}).addTo(this.map);
            document.getElementById('statusMsg').innerText = '📌 Pin fijado en: '+STATE.coord.map(x=>x.toFixed(3)).join(', ');
        });
        
        this.map.on('zoomend', () => {
            const z = this.map.getZoom();
            document.getElementById('mapFull').className = z<=5?'map-small':z<=8?'map-medium':z<=11?'map-large':'map-xlarge';
            renderStations(STATE.variable);
        });
        
        document.getElementById('mapFull').className = 'map-medium';
        renderStations('temp');
    },
    handleLocationSelect() {
        const v = document.getElementById('selCiudad').value;
        if (STATE.marker) this.map.removeLayer(STATE.marker);
        if (v === 'custom') {
            STATE.coord = null;
            document.getElementById('statusMsg').innerText = '📍 Haga clic en el mapa.';
            return;
        }
        STATE.coord = v.split(',').map(Number);
        STATE.marker = L.circleMarker(STATE.coord, {radius:8,fillColor:'#38bdf8',color:'#fff',weight:2,fillOpacity:.8}).addTo(this.map);
        this.map.flyTo(STATE.coord, 10, {duration:1.5});
    }
};

function getGradient(type, val) {
    if (type === 'temp') {
        if (val <= 5) return 'linear-gradient(135deg, #3b82f6, #1e40af)';
        if (val <= 15) return 'linear-gradient(135deg, #38bdf8, #0284c7)';
        if (val <= 25) return 'linear-gradient(135deg, #fbbf24, #f59e0b)';
        return 'linear-gradient(135deg, #ef4444, #dc2626)';
    }
    if (type === 'lluvia') {
        if (val === 0) return 'linear-gradient(135deg, #64748b, #475569)';
        if (val < 5) return 'linear-gradient(135deg, #38bdf8, #0284c7)';
        if (val < 15) return 'linear-gradient(135deg, #1d4ed8, #1e40af)';
        return 'linear-gradient(135deg, #8b5cf6, #6d28d9)';
    }
    if (type === 'viento') {
        if (val < 15) return 'linear-gradient(135deg, #34d399, #10b981)';
        if (val < 30) return 'linear-gradient(135deg, #f59e0b, #d97706)';
        return 'linear-gradient(135deg, #ef4444, #991b1b)';
    }
}

function renderStations(variable) {
    if (!MapMgr.map) return;
    STATE.stationMarkers.forEach(m => MapMgr.map.removeLayer(m));
    STATE.stationMarkers = [];
    
    STATIONS.forEach(est => {
        let txt='--', gradient='#475569', icon='❓';
        if (variable === 'temp') {txt=est.temp.toFixed(1)+'°C'; gradient=getGradient('temp',est.temp); icon='🌡️';}
        else if (variable === 'lluvia') {txt=est.lluvia.toFixed(0)+'mm'; gradient=getGradient('lluvia',est.lluvia); icon='🌧️';}
        else {txt=est.viento.toFixed(0)+'km/h'; gradient=getGradient('viento',est.viento); icon='💨';}
        
        const iconHtml = `<div class="station-inner" style="background:${gradient};">${icon} ${txt}</div>`;
        const marker = L.marker([est.lat,est.lon], {icon:L.divIcon({className:'station-badge',html:iconHtml,iconSize:[100,30],iconAnchor:[50,15]})});
        marker.bindPopup(`<div><div class="popup-header"><h3>📍 ${est.nombre}</h3><span class="popup-badge">${est.provincia}</span></div><div class="popup-row"><span class="label">🌡️</span><span class="value">${est.temp.toFixed(1)}°C</span></div><div class="popup-row"><span class="label">🌧️</span><span class="value">${est.lluvia.toFixed(1)}mm</span></div><div class="popup-row"><span class="label">💨</span><span class="value">${est.viento.toFixed(1)}km/h</span></div></div>`, {maxWidth:280});
        marker.addTo(MapMgr.map);
        STATE.stationMarkers.push(marker);
    });
}

function cambiarVariable(variable) {
    STATE.variable = variable;
    renderStations(variable);
    actualizarLeyenda(variable);
}

function actualizarLeyenda(variable) {
    const legends = {
        temp: [{color:'#3b82f6',texto:'≤5°C - Frío'},{color:'#38bdf8',texto:'5-15°C'},{color:'#fbbf24',texto:'15-25°C'},{color:'#ef4444',texto:'>25°C'}],
        lluvia: [{color:'#64748b',texto:'0mm - Seco'},{color:'#38bdf8',texto:'<5mm'},{color:'#1d4ed8',texto:'5-15mm'},{color:'#8b5cf6',texto:'>15mm'}],
        viento: [{color:'#34d399',texto:'<15km/h'},{color:'#f59e0b',texto:'15-30km/h'},{color:'#ef4444',texto:'>30km/h'}]
    };
    document.getElementById('legendContent').innerHTML = (legends[variable]||[]).map(item=>`<div class="legend-item"><div class="legend-color" style="background:${item.color};"></div><span>${item.texto}</span></div>`).join('');
}

async function fetchWeather() {
    if (!STATE.coord) {alert('Seleccione ubicación');return;}
    const [lat,lon] = STATE.coord;
    const msg = document.getElementById('statusMsg');
    msg.innerText = '🔄 Sincronizando...';
    
    try {
        const p = new URLSearchParams({latitude:lat,longitude:lon,current_weather:'true',hourly:'temperature_2m,relative_humidity_2m,surface_pressure,dew_point_2m',timezone:'auto'});
        const r = await fetch(`https://api.open-meteo.com/v1/forecast?${p.toString()}`, {signal:AbortSignal.timeout(8000)});
        const d = await r.json();
        const c = d.current_weather;
        const h = d.hourly;
        document.getElementById('resTemp').innerText = c.temperature.toFixed(1)+'°C';
        document.getElementById('resHumedad').innerText = (h.relative_humidity_2m[0]||0).toFixed(0)+'%';
        document.getElementById('resViento').innerText = c.windspeed.toFixed(0)+' km/h';
        document.getElementById('resPresion').innerText = (h.surface_pressure[0]||0).toFixed(0)+' hPa';
        document.getElementById('resRocio').innerText = (h.dew_point_2m[0]||0).toFixed(1)+'°C';
        msg.innerText = '✅ Datos recibidos';
        msg.style.color = '#22c55e';
    } catch (e) {
        msg.innerText = '❌ Error: '+e.message;
        msg.style.color = '#ef4444';
    }
}

window.addEventListener('DOMContentLoaded', () => {
    MapMgr.init();
    actualizarLeyenda('temp');
});
</script>
</body>
</html>
