<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetricMine Module</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #0d0d0d; color: #e2e8f0; }
        .container { padding: 20px; display: flex; gap: 20px; box-sizing: border-box; height: 100vh;}
        
        .sidebar { width: 400px; background: #0d0d0d; border: 1px solid #222; border-radius: 4px; padding: 20px; display: flex; flex-direction: column; overflow-y: auto; }
        
        /* NUEVO: Contenedor Grid 2x2 de alturas y anchos idénticos */
        .main-content { flex-grow: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 15px; border-radius: 4px; }
        .map-panel { background: #000; border: 1px solid #333; border-radius: 4px; display: flex; flex-direction: column; overflow: hidden;}
        .map-panel-title { text-align: center; font-family: monospace; color: #888; font-size: 11px; padding: 8px 0; margin: 0; background: #111; border-bottom: 1px solid #333;}
        .map-container { flex-grow: 1; width: 100%; }

        /* Estilos de botones de la barra lateral (mantenidos del original) */
        h2 { color: #f59e0b; font-family: monospace; margin-top: 0;}
        select { width: 100%; background: #000; border: 1px solid #444; color: #f59e0b; padding: 10px; margin-bottom: 15px; font-family: monospace;}
        .btn-primary { padding: 12px; font-weight: bold; cursor: pointer; border: none; flex: 1; font-family: monospace;}
        .btn-vega { background-color: #f59e0b; color: #000; } .btn-nieve { background-color: #38bdf8; color: #000; }
    </style>
</head>
<body>

<div class="container">
    <div class="sidebar">
        <h2>[ METRIC MINE ]</h2>
        <select id="selSitioMinero" onchange="moverMapaASitio()">
            <option value="custom">Dibujo Libre en Mapa</option>
            <option value="-23.82,-66.81">Salar de Olaroz (Jujuy)</option>
            <option value="glaciar_cachi">Nevado de Cachi (Salta)</option>
        </select>
        
        <div style="display: flex; gap: 10px; margin-top: auto; padding-top: 15px;">
            <button class="btn-primary btn-vega" onclick="ejecutarAuditoria('vega')">🌱 VEGA (SAR)</button>
            <button class="btn-primary btn-nieve" onclick="ejecutarAuditoria('nieve')">🏔️ NIEVE (ÓPTICO)</button>
        </div>
    </div>
    
    <!-- NUEVO: 4 Mapas Sincronizados -->
    <div class="main-content">
        <div class="map-panel">
            <h4 class="map-panel-title">MAPA MAESTRO (CIUDADES Y VECTORES)</h4>
            <div id="mapBase" class="map-container"></div>
        </div>
        <div class="map-panel">
            <h4 class="map-panel-title">GEMELO TÉRMICO (InSAR)</h4>
            <div id="mapTermico" class="map-container"></div>
        </div>
        <div class="map-panel">
            <h4 class="map-panel-title" style="color: #f59e0b;">GEMELO VEGA (SAR - HUMEDALES)</h4>
            <div id="mapVega" class="map-container"></div>
        </div>
        <div class="map-panel">
            <h4 class="map-panel-title" style="color: #38bdf8;">GEMELO NIEVE (ÓPTICO - NDSI)</h4>
            <div id="mapNieve" class="map-container"></div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

<script>
    // Configuración base de mapas
    const center = [-24.2, -67.0];
    const zoom = 7;
    const darkTile = 'https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png';

    // Inicializar los 4 mapas
    var mapBase = L.map('mapBase').setView(center, zoom);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {maxZoom: 18}).addTo(mapBase);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png').addTo(mapBase);
    
    var mapTermico = L.map('mapTermico', {zoomControl: false}).setView(center, zoom);
    L.tileLayer(darkTile).addTo(mapTermico);
    
    var mapVega = L.map('mapVega', {zoomControl: false}).setView(center, zoom);
    L.tileLayer(darkTile).addTo(mapVega);
    
    var mapNieve = L.map('mapNieve', {zoomControl: false}).setView(center, zoom);
    L.tileLayer(darkTile).addTo(mapNieve);

    // Sincronización Maestra (Mover uno mueve a todos)
    const maps = [mapBase, mapTermico, mapVega, mapNieve];
    let isSyncing = false;
    
    maps.forEach(sourceMap => {
        sourceMap.on('move', () => {
            if (isSyncing) return;
            isSyncing = true;
            const c = sourceMap.getCenter();
            const z = sourceMap.getZoom();
            maps.forEach(targetMap => {
                if (targetMap !== sourceMap) targetMap.setView(c, z, {animate: false});
            });
            isSyncing = false;
        });
    });

    // Control de dibujo solo en el mapa maestro
    var drawnItems = new L.FeatureGroup(); mapBase.addLayer(drawnItems);
    var drawControl = new L.Control.Draw({ draw: { polyline: false, marker: false, circle: false }, edit: { featureGroup: drawnItems }}); 
    mapBase.addControl(drawControl);
</script>
</body>
</html>
