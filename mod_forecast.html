<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecast Command Center - MetricPoint</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet para el Mapa -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body { margin: 0; padding: 0; background-color: #020617; font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden; }
        
        .glass-hud {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
        }

        .glass-module {
            background: rgba(2, 6, 23, 0.95);
            border: 1px solid rgba(51, 65, 85, 0.8);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        #mapaCentral { height: 100%; width: 100%; background: #000; z-index: 1; }
        
        .mod-btn {
            background: #0f172a; color: #64748b; border: 1px solid #1e293b;
            text-transform: uppercase; letter-spacing: 1px; font-size: 12px; font-weight: bold;
            transition: all 0.3s ease;
        }
        .mod-btn:hover { background: #1e293b; color: #cbd5e1; }
        .mod-btn.active {
            background: #0284c7; color: #ffffff; border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }

        .leaflet-popup-content-wrapper { background: #0f172a; color: #38bdf8; border: 1px solid #0284c7; border-radius: 8px; font-family: monospace; font-weight: bold; text-align: center; }
        .leaflet-popup-tip { background: #0f172a; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #38bdf8; border-radius: 10px; }
        
        .radar-scan { position: relative; overflow: hidden; }
        .radar-scan::after {
            content: ''; position: absolute; top: -100%; left: 0; right: 0; height: 100%;
            background: linear-gradient(to bottom, transparent, rgba(56, 189, 248, 0.2), transparent);
            animation: scan 2s linear infinite;
        }
        @keyframes scan { 0% { top: -100%; } 100% { top: 100%; } }
    </style>
</head>
<body class="text-slate-100 flex flex-col h-screen">

    <!-- SECCIÓN SUPERIOR: MAPA DOMINANTE -->
    <div class="relative w-full h-[65vh] border-b-2 border-sky-500/50 shadow-[0_10px_30px_rgba(2,132,199,0.2)]">
        
        <div id="mapaCentral"></div>

        <!-- HUD FLOTANTE: Telemetría -->
        <div class="absolute top-4 left-4 z-[1000] glass-hud p-4 rounded-2xl w-80 flex flex-col gap-3 transition-all duration-300">
            <div class="flex items-center justify-between border-b border-sky-500/30 pb-2">
                <h2 class="text-sm font-black tracking-widest text-sky-400"><i class="fa-solid fa-satellite mr-2"></i>LINK TELEMÉTRICO</h2>
                <span id="hud-status" class="flex h-3 w-3"><span class="animate-ping absolute inline-flex h-3 w-3 rounded-full bg-emerald-400 opacity-75"></span><span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span></span>
            </div>

            <select id="stationSelector" onchange="sincronizarHUD()" class="w-full bg-slate-900 border border-sky-500/50 text-sky-300 font-bold text-xs rounded-lg py-2 px-2 focus:outline-none appearance-none cursor-pointer">
                <option value="IMONTE1127|-27.17|-65.50|Monteros (INTA)">IMONTE1127 - Monteros (INTA)</option>
                <option value="ISANMI169|-26.83|-65.20|SM de Tucumán 169">ISANMI169 - SMT 169</option>
                <option value="ISANMI87|-26.83|-65.20|SM de Tucumán 87">ISANMI87 - SMT 87</option>
                <option value="IVILLA1124|-26.80|-65.25|Villa Carmela">IVILLA1124 - Villa Carmela</option>
                <option value="IDEABR3|-26.84|-65.16|Zona Este">IDEABR3 - Zona Este</option>
                <option value="IESCUE2|-26.83|-65.20|Zona Central">IESCUE2 - Zona Central</option>
                <option value="IBURRU13|-26.50|-64.74|Burruyacú">IBURRU13 - Burruyacú</option>
                <option value="IBARRI105|-26.83|-65.20|Barrio (SMT)">IBARRI105 - Barrio (SMT)</option>
                <option value="IYERBA8|-26.81|-65.32|Yerba Buena 8">IYERBA8 - Yerba Buena 8</option>
                <option value="IYERBA10|-26.81|-65.32|Yerba Buena 10">IYERBA10 - Yerba Buena 10</option>
                <option value="ISARGE7|-26.83|-65.20|San Miguel (Sarge)">ISARGE7 - SMT (Sarge)</option>
                <option value="ICONCE101|-27.34|-65.59|Concepción">ICONCE101 - Concepción</option>
                <option value="ILEALE3|-27.19|-65.30|Leales 3">ILEALE3 - Leales 3</option>
                <option value="ILEALE2|-27.19|-65.30|Leales 2">ILEALE2 - Leales 2</option>
            </select>

            <div class="grid grid-cols-2 gap-2 mt-1">
                <div class="bg-slate-900/60 p-2 rounded-lg border border-slate-700">
                    <span class="text-[10px] text-slate-400 uppercase tracking-wider block">Temp Ambiente</span>
                    <span class="text-2xl font-mono font-bold text-white" id="hud-temp">--</span><span class="text-sm text-sky-400 font-bold">°C</span>
                </div>
                <div class="bg-slate-900/60 p-2 rounded-lg border border-slate-700">
                    <span class="text-[10px] text-slate-400 uppercase tracking-wider block">Humedad</span>
                    <span class="text-2xl font-mono font-bold text-white" id="hud-hum">--</span><span class="text-sm text-sky-400 font-bold">%</span>
                </div>
                <div class="bg-slate-900/60 p-2 rounded-lg border border-slate-700">
                    <span class="text-[10px] text-slate-400 uppercase tracking-wider block">Viento</span>
                    <span class="text-xl font-mono font-bold text-white" id="hud-viento">--</span><span class="text-xs text-sky-400 font-bold ml-1">km/h</span>
                </div>
                <div class="bg-slate-900/60 p-2 rounded-lg border border-slate-700">
                    <span class="text-[10px] text-slate-400 uppercase tracking-wider block">Lluvia (24h)</span>
                    <span class="text-xl font-mono font-bold text-white" id="hud-lluvia">--</span><span class="text-xs text-sky-400 font-bold ml-1">mm</span>
                </div>
            </div>
            <div id="hud-msg" class="text-[10px] text-emerald-400 font-mono text-center mt-1">SISTEMA OPERATIVO</div>
        </div>
    </div>

    <!-- SECCIÓN INFERIOR: MÓDULOS TECNOLÓGICOS -->
    <div class="w-full h-[35vh] flex flex-col p-4 bg-slate-950">
        <div class="flex space-x-2 mb-3">
            <button onclick="activarModulo('mod-tiempo-real', this)" class="mod-btn active flex-1 py-2.5 rounded-lg"><i class="fa-solid fa-satellite-dish mr-2"></i>Tiempo Real</button>
            <button onclick="activarModulo('mod-clima', this)" class="mod-btn flex-1 py-2.5 rounded-lg"><i class="fa-solid fa-cloud-sun-rain mr-2"></i>Clima</button>
            <button onclick="activarModulo('mod-pronostico', this)" class="mod-btn flex-1 py-2.5 rounded-lg"><i class="fa-solid fa-chart-line mr-2"></i>Pronóstico</button>
            <button onclick="activarModulo('mod-advertencia', this)" class="mod-btn flex-1 py-2.5 rounded-lg border-red-900/50 hover:border-red-500 text-red-400 hover:text-red-300"><i class="fa-solid fa-triangle-exclamation mr-2"></i>Advertencia</button>
        </div>

        <div class="glass-module flex-1 rounded-xl p-4 overflow-y-hidden relative">
            <div id="mod-tiempo-real" class="block h-full flex items-center justify-center">
                <div class="text-center text-slate-500 font-mono text-sm border border-dashed border-slate-700 p-6 rounded-lg w-full">
                    [ MÓDULO TIEMPO REAL: Esperando tus instrucciones... ]
                </div>
            </div>
            <div id="mod-clima" class="hidden h-full flex items-center justify-center">
                <div class="text-center text-slate-500 font-mono text-sm border border-dashed border-slate-700 p-6 rounded-lg w-full">
                    [ MÓDULO CLIMA: Esperando tus instrucciones... ]
                </div>
            </div>
            <div id="mod-pronostico" class="hidden h-full flex items-center justify-center">
                <div class="text-center text-slate-500 font-mono text-sm border border-dashed border-slate-700 p-6 rounded-lg w-full">
                    [ MÓDULO PRONÓSTICO: Esperando tus instrucciones... ]
                </div>
            </div>
            <!-- MÓDULO ADVERTENCIA -->
            <div id="mod-advertencia" class="hidden h-full"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // ==========================================
        // 1. CONFIGURACIÓN DEL MAPA
        // ==========================================
        const mapForecast = L.map('mapaCentral', { zoomControl: false }).setView([-26.83, -65.20], 8);
        L.control.zoom({ position: 'bottomright' }).addTo(mapForecast);
        
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 18, attribution: 'Tiles &copy; Esri'
        }).addTo(mapForecast);

        L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 18
        }).addTo(mapForecast);

        let marcadorActual = null;
        let capaAlertasSMN = L.layerGroup().addTo(mapForecast);

        // ==========================================
        // 2. EXTRACCIÓN DE DATOS TELEMÉTRICOS (HUD)
        // ==========================================
        async function sincronizarHUD() {
            const selector = document.getElementById('stationSelector');
            const data = selector.value.split('|');
            const stationId = data[0];
            const lat = parseFloat(data[1]);
            const lon = parseFloat(data[2]);
            const nombreEstacion = data[3];

            mapForecast.flyTo([lat, lon], 9, { duration: 1.5 });
            
            if (marcadorActual) mapForecast.removeLayer(marcadorActual);
            marcadorActual = L.circleMarker([lat, lon], {
                radius: 10, fillColor: "#38bdf8", color: "#ffffff", weight: 2, fillOpacity: 0.8
            }).addTo(mapForecast).bindPopup(`ACTIVO:<br>${nombreEstacion}`).openPopup();

            const url = `https://api.weather.com/v2/pws/observations/current?stationId=${stationId}&format=json&units=e&apiKey=e1f10a1e78da46f5b10a1e78da96f525`;

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Error');
                const json = await response.json();
                const obs = json.observations[0];
                const imp = obs.imperial;

                document.getElementById('hud-temp').innerText = ((imp.temp - 32) * 5 / 9).toFixed(1);
                document.getElementById('hud-hum').innerText = obs.humidity;
                document.getElementById('hud-viento').innerText = (imp.windSpeed * 1.60934).toFixed(1);
                document.getElementById('hud-lluvia').innerText = (imp.precipTotal * 25.4).toFixed(1);
                document.getElementById('hud-msg').innerText = `SISTEMA OPERATIVO • ${obs.obsTimeLocal.split(' ')[1]}`;
                document.getElementById('hud-msg').className = "text-[10px] text-emerald-400 font-mono text-center mt-1";
            } catch (error) {
                ['hud-temp', 'hud-hum', 'hud-viento', 'hud-lluvia'].forEach(id => document.getElementById(id).innerText = '--');
                document.getElementById('hud-msg').innerText = "ESTACIÓN OFFLINE";
                document.getElementById('hud-msg').className = "text-[10px] text-red-500 font-mono text-center mt-1";
            }
        }

        // ==========================================
        // 3. MOTOR DE ALERTAS SMN (EXTREMO / ANTI-FALLOS)
        // ==========================================
        const CORS_PROXY = "https://api.allorigins.win/get?url=";

        function formatearFecha(isoString) {
            if (!isoString) return "No esp.";
            try {
                const date = new Date(isoString);
                if (isNaN(date)) return isoString;
                return date.toLocaleString('es-AR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute:'2-digit' });
            } catch(e) { return isoString; }
        }

        async function fetchSMNFeed(urlFeed) {
            try {
                // Anti-caché brutal para garantizar datos frescos
                const proxyUrl = CORS_PROXY + encodeURIComponent(urlFeed + "?v=" + new Date().getTime());
                const response = await fetch(proxyUrl);
                if (!response.ok) return [];
                
                const data = await response.json();
                if (!data.contents) return [];

                const parser = new DOMParser();
                const xml = parser.parseFromString(data.contents, "application/xml");
                
                // Buscar etiquetas item (RSS)
                const items = xml.getElementsByTagName("item");
                let alertasLocales = [];

                for (let i = 0; i < items.length; i++) {
                    let item = items[i];
                    
                    const title = item.getElementsByTagName("title")[0]?.textContent || "Alerta Meteorológica";
                    const desc = item.getElementsByTagName("description")[0]?.textContent || "Revise el reporte oficial.";
                    const link = item.getElementsByTagName("link")[0]?.textContent || "#";
                    
                    const pubDate = item.getElementsByTagName("pubDate")[0]?.textContent || "";
                    const expires = item.getElementsByTagName("expires")[0]?.textContent || "";

                    const cleanTitle = title.replace(/<!\[CDATA\[/g, '').replace(/\]\]>/g, '').trim();
                    const cleanDesc = desc.replace(/<!\[CDATA\[/g, '').replace(/\]\]>/g, '').replace(/<[^>]*>?/gm, '').trim();

                    // POLÍGONOS
                    let polygonStr = item.getElementsByTagName('polygon')[0]?.textContent || item.getElementsByTagName('georss:polygon')[0]?.textContent || "";
                    let polygonCoords = [];
                    if (polygonStr) {
                        let pairs = polygonStr.trim().split(' ');
                        pairs.forEach(pair => {
                            let coords = pair.split(',');
                            if(coords.length === 2) {
                                polygonCoords.push([parseFloat(coords[0]), parseFloat(coords[1])]);
                            }
                        });
                    }

                    // EXTRACCIÓN DE TEXTO ABSOLUTO (Lee todo el contenido oculto en el XML)
                    const contenidoTotal = item.textContent || cleanTitle + " " + cleanDesc;

                    // FILTRO DE ESPECTRO AMPLIO: Captura cualquier mención de provincias del NOA o regiones topográficas
                    const regexNOA = /Tucum[aá]n|Salta|Jujuy|Catamarca|Santiago del Estero|Taf[ií]|Calchaqu[ií]|Puna|Andina|Cafayate|Zonda|Oeste|Noroeste|Cordillera/i;
                    
                    let nivel = "AMARILLO";
                    let textColor = "text-yellow-400";
                    let borderColor = "border-yellow-500";
                    let mapColor = "#eab308";
                    let mapFill = "#fef08a";
                    
                    if (/naranja/i.test(contenidoTotal)) {
                        nivel = "NARANJA"; textColor = "text-orange-400"; borderColor = "border-orange-500"; mapColor = "#f97316"; mapFill = "#fed7aa";
                    } else if (/roja|rojo/i.test(contenidoTotal)) {
                        nivel = "ROJO"; textColor = "text-red-400"; borderColor = "border-red-500"; mapColor = "#ef4444"; mapFill = "#fecaca";
                    }

                    // GUARDAMOS LA ALERTA. Si tiene el regexNOA, la marcamos como Principal. Si no, como Secundaria.
                    const esZonaNOA = regexNOA.test(contenidoTotal);

                    alertasLocales.push({ 
                        titulo: cleanTitle, 
                        descripcion: cleanDesc, 
                        link: link, 
                        nivel: nivel, 
                        textColor: textColor, 
                        borderColor: borderColor,
                        inicio: formatearFecha(pubDate),
                        fin: formatearFecha(expires),
                        poligono: polygonCoords,
                        mapColor: mapColor,
                        mapFill: mapFill,
                        esNOA: esZonaNOA
                    });
                }
                return alertasLocales;
            } catch (e) {
                console.error("Fallo parseando Feed:", e);
                return [];
            }
        }

        async function cargarAdvertenciasSMN() {
            const contenedor = document.getElementById('mod-advertencia');
            
            contenedor.innerHTML = `
                <div class="h-full flex flex-col items-center justify-center space-y-3">
                    <i class="fa-solid fa-satellite-dish text-4xl text-sky-500 animate-ping"></i>
                    <p class="text-xs font-mono text-sky-400 uppercase tracking-widest">Forzando conexión directa con SMN CAP...</p>
                </div>
            `;

            const urls = [
                "https://ssl.smn.gob.ar/feeds/CAP/rss_alertaCAP_nuevo_2026.xml",
                "https://ssl.smn.gob.ar/feeds/CAP/oladecalor/rss_ola_calor_nuevo.xml",
                "https://ssl.smn.gob.ar/feeds/CAP/avisocortoplazo/rss_acpCAP.xml"
            ];
            
            const resultados = await Promise.all(urls.map(url => fetchSMNFeed(url)));
            capaAlertasSMN.clearLayers();

            // FUNCIÓN PARA RENDERIZAR
            const generarHTMLTarjetas = (alertasArr) => {
                if (alertasArr.length === 0) {
                    return `
                        <div class="h-full flex flex-col items-center justify-center text-center opacity-50 p-4">
                            <i class="fa-solid fa-shield-check text-2xl text-emerald-500 mb-1"></i>
                            <span class="text-[9px] font-mono text-emerald-400 tracking-widest uppercase">ZONA DESPEJADA</span>
                        </div>`;
                }

                let html = '';
                alertasArr.forEach(a => {
                    // Si el polígono existe, lo dibujamos en el mapa
                    if (a.poligono && a.poligono.length > 0) {
                        L.polygon(a.poligono, {
                            color: a.mapColor, fillColor: a.mapFill, weight: 2, fillOpacity: 0.35
                        }).bindPopup(`<div class="text-xs text-center font-sans"><b>${a.titulo}</b><br>Fin: ${a.fin}</div>`).addTo(capaAlertasSMN);
                    }

                    // Si no es estrictamente NOA, le ponemos un aviso visual para que sepas por qué apareció
                    let badgeZona = a.esNOA ? "" : `<span class="text-[8px] bg-slate-700 text-slate-300 px-1 rounded ml-1">ZONA ADYACENTE / NACIONAL</span>`;

                    html += `
                        <div class="border-l-4 ${a.borderColor} bg-slate-800/60 p-2 rounded mb-2 shadow-sm">
                            <div class="flex justify-between items-center mb-1">
                                <div>
                                    <span class="text-[9px] font-black tracking-widest ${a.textColor} uppercase bg-black/40 px-1 py-0.5 rounded">NIVEL ${a.nivel}</span>
                                    ${badgeZona}
                                </div>
                                <span class="text-[8px] text-slate-400"><i class="fa-regular fa-clock"></i> 72H</span>
                            </div>
                            <h4 class="text-[10px] font-bold text-white leading-tight mb-1">${a.titulo}</h4>
                            <p class="text-[9px] text-slate-400 line-clamp-2 leading-snug mb-1">${a.descripcion}</p>
                            <div class="bg-black/30 p-1.5 rounded flex flex-col text-[9px] text-slate-300 border border-slate-700/50">
                                <div class="flex items-center gap-1"><i class="fa-solid fa-play text-emerald-400"></i> <b>INICIO:</b> ${a.inicio}</div>
                                <div class="flex items-center gap-1 mt-0.5"><i class="fa-solid fa-stop text-rose-400"></i> <b>FIN:</b> ${a.fin}</div>
                            </div>
                            <a href="${a.link}" target="_blank" class="block text-right text-[9px] text-sky-400 hover:text-sky-300 uppercase mt-1.5"><i class="fa-solid fa-link mr-1"></i>SAT Oficial SMN</a>
                        </div>
                    `;
                });
                return html;
            };

            // Reconstruimos la Interfaz
            contenedor.innerHTML = `
                <div class="h-full flex flex-col">
                    <div class="flex justify-between items-center mb-2 border-b border-slate-700 pb-2 shrink-0">
                        <h3 class="text-xs font-black tracking-widest text-sky-400 uppercase"><i class="fa-solid fa-satellite-dish mr-2"></i>Monitoreo SMN (Espectro Amplio)</h3>
                        <div id="smn-global-status" class="text-[10px] font-mono px-2 py-1 rounded"></div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3 flex-1 overflow-hidden">
                        <div class="flex flex-col bg-[#020617] border border-slate-700 rounded-lg shadow-lg overflow-hidden">
                            <div class="bg-slate-800/80 p-2 border-b border-slate-700 flex justify-between items-center shrink-0">
                                <span class="text-[10px] font-bold uppercase text-slate-300"><i class="fa-solid fa-cloud-bolt text-yellow-500 mr-1"></i> Alertas Met.</span>
                                <span id="badge-alertas"></span>
                            </div>
                            <div id="col-alertas" class="flex-1 overflow-y-auto p-2">${generarHTMLTarjetas(resultados[0])}</div>
                        </div>

                        <div class="flex flex-col bg-[#020617] border border-slate-700 rounded-lg shadow-lg overflow-hidden">
                            <div class="bg-slate-800/80 p-2 border-b border-slate-700 flex justify-between items-center shrink-0">
                                <span class="text-[10px] font-bold uppercase text-slate-300"><i class="fa-solid fa-temperature-arrow-up text-orange-500 mr-1"></i> Extremos</span>
                                <span id="badge-extremos"></span>
                            </div>
                            <div id="col-extremos" class="flex-1 overflow-y-auto p-2">${generarHTMLTarjetas(resultados[1])}</div>
                        </div>

                        <div class="flex flex-col bg-[#020617] border border-slate-700 rounded-lg shadow-lg overflow-hidden">
                            <div class="bg-slate-800/80 p-2 border-b border-slate-700 flex justify-between items-center shrink-0">
                                <span class="text-[10px] font-bold uppercase text-slate-300"><i class="fa-solid fa-triangle-exclamation text-red-500 mr-1"></i> Corto Plazo</span>
                                <span id="badge-acp"></span>
                            </div>
                            <div id="col-acp" class="flex-1 overflow-y-auto p-2">${generarHTMLTarjetas(resultados[2])}</div>
                        </div>
                    </div>
                </div>
            `;

            const totalAlertas = resultados[0].length + resultados[1].length + resultados[2].length;
            const statusDiv = document.getElementById('smn-global-status');
            
            // Actualizar luces de los badges
            const setBadge = (id, count) => {
                document.getElementById(id).innerHTML = count > 0 
                    ? '<span class="flex h-2 w-2 relative"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span><span class="relative inline-flex rounded-full h-2 w-2 bg-red-500"></span></span>'
                    : '<span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>';
            };
            setBadge('badge-alertas', resultados[0].length);
            setBadge('badge-extremos', resultados[1].length);
            setBadge('badge-acp', resultados[2].length);

            if (totalAlertas > 0) {
                statusDiv.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-red-500 mr-1"></i> <span class="text-red-400">${totalAlertas} REGISTROS CAPTURADOS</span>`;
                statusDiv.className = "text-[10px] font-mono bg-red-950/50 text-red-400 px-2 py-1 rounded border border-red-900/50 shadow-[0_0_10px_rgba(239,68,68,0.2)]";
            } else {
                statusDiv.innerHTML = `<i class="fa-solid fa-check text-emerald-500 mr-1"></i> <span class="text-emerald-400">RED NACIONAL DESPEJADA</span>`;
                statusDiv.className = "text-[10px] font-mono bg-emerald-950/50 text-emerald-400 px-2 py-1 rounded border border-emerald-900/50";
            }
        }

        // ==========================================
        // 4. CONTROL DE PESTAÑAS
        // ==========================================
        function activarModulo(idModulo, btnElement) {
            document.getElementById('mod-tiempo-real').classList.replace('block', 'hidden');
            document.getElementById('mod-clima').classList.replace('block', 'hidden');
            document.getElementById('mod-pronostico').classList.replace('block', 'hidden');
            document.getElementById('mod-advertencia').classList.replace('block', 'hidden');
            
            document.querySelectorAll('.mod-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(idModulo).classList.replace('hidden', 'block');
            btnElement.classList.add('active');

            if (idModulo === 'mod-advertencia') {
                cargarAdvertenciasSMN();
            }
        }

        window.onload = () => sincronizarHUD();
        setInterval(sincronizarHUD, 300000); 
    </script>
</body>
</html>
