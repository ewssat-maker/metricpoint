<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Cumplimiento Minero ESG</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0d0d0d; color: #ffffff; margin: 0; padding: 30px; }
        h2 { font-weight: 400; font-size: 28px; margin-bottom: 20px; color: #00d26a; font-family: monospace; text-align: center;}
        
        /* NUEVO: Cuadrícula del Gemelo Digital */
        .twin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 1200px; margin: 0 auto 20px auto; }
        .map-box { border: 1px solid #333; border-radius: 8px; background: #121212; padding: 10px; display: flex; flex-direction: column;}
        .map-title { text-align: center; color: #00d26a; font-family: monospace; margin: 0 0 10px 0; font-size: 14px;}
        .map-container { height: 450px; border-radius: 4px; border: 1px solid #222; }

        .dashboard-top { display: flex; justify-content: center; gap: 50px; margin-bottom: 40px; align-items: center; flex-wrap: wrap;}
        .dial-container { text-align: center; }
        .dial { width: 120px; height: 120px; border-radius: 50%; border: 12px solid #333; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; margin-bottom: 15px;}
        .dial-text { font-size: 13px; color: #aaa; text-transform: uppercase; font-family: monospace;}
        
        .status-box { background-color: #1a1a1a; padding: 20px; border-radius: 8px; font-size: 14px; border: 1px solid #333;}
        .btn-primary { background-color: #00d26a; color: #000; width: 100%; max-width: 1200px; display: block; margin: 0 auto 40px auto; padding: 15px; font-weight: bold; cursor: pointer; border: none; font-size: 16px; font-family: monospace;}
        .btn-primary:hover { background-color: #00b058; }
        .chart-container { max-width: 1200px; margin: 0 auto 40px auto; background: #121212; padding: 20px; border-radius: 8px; border: 1px solid #333; }
        
        /* Estilos de estado omitidos por brevedad (mantener los originales bg-green, bg-red, etc) */
        .border-green { border-color: #00d26a !important; } .border-red { border-color: #ff4444 !important; }
    </style>
</head>
<body>

<h2>[ CONSOLA DE AUDITORÍA ESG - NOA ]</h2>

<!-- NUEVO: Contenedor de Gemelos Digitales Sincronizados -->
<div class="twin-grid">
    <div class="map-box">
        <h4 class="map-title">MAPA BASE (Topografía y Ciudades)</h4>
        <div id="mapESG" class="map-container"></div>
    </div>
    <div class="map-box">
        <h4 class="map-title">GEMELO DIGITAL (Matriz de Calor InSAR)</h4>
        <div id="mapTwin" class="map-container"></div>
    </div>
</div>

<button class="btn-primary" onclick="ejecutarAuditoriaSatelital()">EJECUTAR AUDITORÍA SATELITAL AUTOMATIZADA</button>
<p id="statusTxt" style="text-align: center; color: #f59e0b; font-family: monospace; font-size: 14px; max-width: 1200px; margin: -30px auto 30px auto;"></p>

<div class="dashboard-top">
    <div class="dial-container">
        <div class="dial" id="dial-def" style="border-color: #333;">-- mm</div>
        <div class="dial-text">Deformación Relaves</div>
    </div>
    <div class="dial-container">
        <div class="dial" id="dial-turb" style="border-color: #333;">-- %</div>
        <div class="dial-text">Turbidez del Agua</div>
    </div>
</div>

<div class="chart-container">
    <h3 style="margin-top: 0; color: #00d26a; font-family: monospace; font-size: 14px;">Evolución de Deformación Estructural (Sentinel-1)</h3>
    <canvas id="chartInSAR" height="60"></canvas>
</div>

<!-- Scripts de Mapa -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

<script>
    // 1. Inicializar Mapa Base (Con etiquetas y topografía)
    var map = L.map('mapESG').setView([-24.1, -66.3], 8);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {maxZoom: 18}).addTo(map);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png', {maxZoom: 18}).addTo(map);
    
    // 2. Inicializar Gemelo Digital (Fondo oscuro limpio para resaltar el calor)
    var mapTwin = L.map('mapTwin', {zoomControl: false}).setView([-24.1, -66.3], 8);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png', {maxZoom: 18}).addTo(mapTwin);

    // 3. LÓGICA DE SINCRONIZACIÓN (El efecto "Espejo")
    let syncFlag = false;
    map.on('move', function() {
        if(!syncFlag) { syncFlag = true; mapTwin.setView(map.getCenter(), map.getZoom(), {animate: false}); syncFlag = false; }
    });
    mapTwin.on('move', function() {
        if(!syncFlag) { syncFlag = true; map.setView(mapTwin.getCenter(), mapTwin.getZoom(), {animate: false}); syncFlag = false; }
    });

    // Control de dibujo solo en el mapa maestro
    var drawnItems = new L.FeatureGroup(); map.addLayer(drawnItems);
    var drawControl = new L.Control.Draw({ draw: { polyline: false, marker: false, circle: false }, edit: { featureGroup: drawnItems } });
    map.addControl(drawControl);
    
    var poligonoActual = null;
    map.on(L.Draw.Event.CREATED, function (event) {
        drawnItems.clearLayers(); drawnItems.addLayer(event.layer);
        poligonoActual = event.layer.toGeoJSON().geometry.coordinates;
        // Reflejamos el dibujo en el gemelo
        L.geoJSON(event.layer.toGeoJSON(), {style: {color: '#ff4444', weight: 2, fillOpacity: 0.1}}).addTo(mapTwin);
    });

    async function ejecutarAuditoriaSatelital() {
        if (!poligonoActual) return alert("Dibuje el polígono.");
        
        const response = await fetch('https://metricmoisture-backend.onrender.com/api/mining/esg-audit', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ coordenadas: poligonoActual, inicio: '2026-01-01', fin: '2026-09-22' })
        });
        const data = await response.json();

        if (response.ok && data.url_mapa_calor) {
            // EL MAPA DE CALOR SE INYECTA ÚNICAMENTE EN EL GEMELO DIGITAL
            if (window.heatmapLayer) mapTwin.removeLayer(window.heatmapLayer);
            
            window.heatmapLayer = L.tileLayer(data.url_mapa_calor, {
                attribution: 'Earth Engine InSAR', opacity: 0.90
            }).addTo(mapTwin);
            
            // Actualizar datos de diales...
            document.getElementById('dial-def').innerText = data.deformacion_mm + " mm";
            document.getElementById('dial-turb').innerText = data.turbidez_pct + " %";
        }
    }
</script>
</body>
</html>
